name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate firebase-config.js from secrets
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          printf 'const FIREBASE_CONFIG = {\n'                                       > js/firebase-config.js
          printf '  apiKey:            "%s",\n' "$FIREBASE_API_KEY"                  >> js/firebase-config.js
          printf '  authDomain:        "%s",\n' "$FIREBASE_AUTH_DOMAIN"              >> js/firebase-config.js
          printf '  projectId:         "%s",\n' "$FIREBASE_PROJECT_ID"               >> js/firebase-config.js
          printf '  storageBucket:     "%s",\n' "$FIREBASE_STORAGE_BUCKET"           >> js/firebase-config.js
          printf '  messagingSenderId: "%s",\n' "$FIREBASE_MESSAGING_SENDER_ID"      >> js/firebase-config.js
          printf '  appId:             "%s"\n'  "$FIREBASE_APP_ID"                   >> js/firebase-config.js
          printf '};\n'                                                               >> js/firebase-config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
