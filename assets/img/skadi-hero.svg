  <!-- Skadi silhouette — archer on the peak (x=960, y=70) -->
  <!-- Figure is ~48px tall, top at y≈18 -->
  <g fill="#07090f">
    <!-- Head -->
    <circle cx="958" cy="37" r="5.5"/>
    <!-- Hair streaming right in the wind -->
    <path d="M961,33 Q971,28 977,31 Q972,32 968,35 Q965,34 961,33 Z"/>
    <!-- Cape/cloak blowing right -->
    <path d="M958,48 Q968,53 975,62 Q966,59 958,53 Z" opacity="0.85"/>
    <!-- Torso (forward lean) -->
    <path d="M954,42 L952,64 L959,66 L963,64 L965,42 Z"/>
    <!-- Left arm: bow arm extended forward-left and slightly up -->
    <path d="M955,50 L935,42 L934,46 L953,54 Z"/>
    <!-- Right arm: draw arm pulled back to right -->
    <path d="M964,50 L980,56 L979,60 L963,54 Z"/>
    <!-- Left leg (forward) -->
    <path d="M954,64 L949,82 L953,83 L958,64 Z"/>
    <!-- Right leg (back, slightly wider stance) -->
    <path d="M962,64 L964,82 L968,82 L965,64 Z"/>
    <!-- Bow (arc at end of left arm) -->
    <path d="M932,36 Q923,43 932,52" fill="none" stroke="#07090f" stroke-width="3" stroke-linecap="round"/>
    <!-- Bowstring (drawn back) -->
    <path d="M932,36 L935,44 L932,52" fill="none" stroke="#07090f" stroke-width="1.4"/>
    <!-- Arrow shaft -->
    <line x1="935" y1="44" x2="962" y2="50" stroke="#07090f" stroke-width="1.8"/>
    <!-- Arrowhead -->
    <polygon points="963,50 957,47 957,53"/>
  </g>

