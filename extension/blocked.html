<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode — Skadi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080e1e;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #0e1629;
      border: 1px solid #1e2a45;
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .lock-icon { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .sub {
      font-size: 13px;
      color: #6e7aaa;
      margin-bottom: 24px;
      line-height: 1.6;
      word-break: break-all;
    }
    .sub strong { color: #cdd6f4; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4d79ff; color: #fff; margin-right: 10px; }
    .btn-ghost   { background: transparent; border: 1px solid #1e2a45; color: #6e7aaa; }
    .timer-wrap { margin-top: 20px; font-size: 12px; color: #6e7aaa; }
    #countdown { font-size: 28px; font-weight: 700; color: #4d79ff; display: block; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock-icon">🔒</div>
    <h1>Focus Mode Active</h1>
    <p class="sub">
      <strong id="blockedHost">This site</strong> is blocked during your study session.<br>
      Stay focused — your future self will thank you.
    </p>
    <button class="btn btn-primary" id="allowTempBtn">Allow for 5 min</button>
    <button class="btn btn-ghost"   id="backBtn">Go back</button>
    <div class="timer-wrap">
      Session timer: <span id="countdown">--</span>
    </div>
  </div>

  <script>
    // Show which site was blocked
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get('from') || '';
    try {
      const host = new URL(fromUrl).hostname;
      document.getElementById('blockedHost').textContent = host || 'This site';
    } catch {}

    // Allow temporarily button
    document.getElementById('allowTempBtn').addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'SKADI_ALLOW_TEMP', url: fromUrl }, () => {
        if (fromUrl) location.href = fromUrl;
      });
    });

    // Go back button
    document.getElementById('backBtn').addEventListener('click', () => {
      history.back();
    });

    // Sync focus state from background and show a session timer
    function updateTimer() {
      chrome.storage.local.get('focusStartedAt', data => {
        if (!data.focusStartedAt) return;
        const elapsed = Math.floor((Date.now() - data.focusStartedAt) / 1000);
        const h = Math.floor(elapsed / 3600);
        const m = Math.floor((elapsed % 3600) / 60);
        const s = elapsed % 60;
        document.getElementById('countdown').textContent =
          h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
                : `${m}:${String(s).padStart(2,'0')}`;
      });
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
